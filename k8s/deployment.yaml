apiVersion: apps/v1
kind: Deployment

metadata:
  name: skyshield-demo
  namespace: skyshield

spec:
  replicas: 2

  selector:
    matchLabels:
      app: skyshield-demo

  template:
    metadata:
      labels:
        app: skyshield-demo

    spec:
      containers:
        - name: skyshield-website
          image: skyshield-website:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10