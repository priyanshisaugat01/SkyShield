name: Checkov IaC Security Scan

on:
  push:
  pull_request:

jobs:
  checkov:
    name: Checkov - Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov and generate JSON report
        id: checkov
        continue-on-error: true
        run: |
          checkov \
            -d infra/terraform \
            --framework terraform \
            --output json > checkov-results.json

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: checkov-results.json

      - name: Fail workflow if Checkov found issues
        if: steps.checkov.outcome == 'failure'
        run: exit 1