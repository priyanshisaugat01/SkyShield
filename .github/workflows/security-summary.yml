name: SkyShield Security Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    name: Security Gates
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Python
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -------------------------
      # Checkov - IaC Security
      # -------------------------
      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        id: checkov
        continue-on-error: true
        run: |
          checkov \
            -d infra/terraform \
            --framework terraform \
            --output json > checkov-results.json

      # -------------------------
      # GitLeaks - Secret Detection
      # -------------------------
      - name: Run GitLeaks
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-results.json \
            --redact

      # -------------------------
      # Docker Build
      # -------------------------
      - name: Build SkyShield Docker image
        run: |
          docker build \
            -t skyshield-website:${{ github.sha }} \
            ./website

      # -------------------------
      # Trivy - Container Security
      # -------------------------
      - name: Run Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: skyshield-website:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: "1"

      # -------------------------
      # Generate Security Summary
      # -------------------------
      - name: Generate security summary
        run: |
          python scripts/build_security_summary.py

      # -------------------------
      # Upload Security Summary
      # -------------------------
      - name: Upload security summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.json

      # -------------------------
      # Upload Individual Reports
      # -------------------------
      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: checkov-results.json

      - name: Upload GitLeaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.json

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json

      # -------------------------
      # Security Gate
      # -------------------------
      - name: Fail pipeline if security checks failed
        if: |
          steps.checkov.outcome == 'failure' ||
          steps.gitleaks.outcome == 'failure' ||
          steps.trivy.outcome == 'failure'
        run: |
          echo "One or more security checks reported findings."
          exit 1